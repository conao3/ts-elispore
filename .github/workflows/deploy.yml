name: Deploy
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v32.1.0
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm exec vp run check
      - run: nix develop --command pnpm run build
      - name: Deploy Worker and custom domain
        run: nix develop --command pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
