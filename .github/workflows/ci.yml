name: Check and deploy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
concurrency:
  group: elispore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.5
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm exec vp run check
      - run: nix build
  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.5
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Refresh catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix develop --command pnpm run catalog
        env:
          GH_TOKEN: ${{ github.token }}
      - run: nix develop --command pnpm exec vp run check
      - run: nix develop --command pnpm run build
      - name: Deploy Worker and custom domain
        run: nix develop --command pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
      - name: Commit refreshed metadata
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json examples/package-archives.jsonl.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub package catalog'
            git push
          fi
