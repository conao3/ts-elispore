name: Check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.10.1
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Refresh catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix develop --command pnpm run catalog
        env:
          GH_TOKEN: ${{ github.token }}
      - run: nix develop --command pnpm exec vp run check
      - run: nix develop --command pnpm run build
      - run: nix build
  catalog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.10.1
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm run catalog
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit refreshed metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub package catalog'
            git push
          fi
